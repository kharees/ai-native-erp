# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# File-name template: date-prefixed for chronological sorting in the
# versions/ directory, followed by revision hash and slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory (backend/).
prepend_sys_path = .

# Timezone for rendered dates inside migration file headers.
# Requires Python >= 3.9 or backports.zoneinfo.
# timezone = UTC

# Max slug length in revision filenames.
truncate_slug_length = 60

# version path separator — os.pathsep (default for new projects)
version_path_separator = os

# Output encoding for revision scripts generated via script.py.mako
output_encoding = utf-8

# ---------------------------------------------------------------------------
# DATABASE URL
# ---------------------------------------------------------------------------
# Left intentionally empty here — env.py overrides this at runtime by
# reading DATABASE_URL from the .env file via app.core.config.Settings.
# Alembic needs a *synchronous* driver URL; env.py swaps the asyncpg
# driver prefix to psycopg2 automatically.
# ---------------------------------------------------------------------------
sqlalchemy.url =


[post_write_hooks]
# Post-write hooks run after a new revision file is generated.
# Uncomment to enable automatic Black formatting:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
