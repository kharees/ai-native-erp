name: CI

# Not verified with a live GitHub Actions run — no CI runner available in
# the sandbox this was written in (see docs/production-hardening.md). Every
# step reproduces a command actually run and verified locally throughout
# this project (pytest, tsc --noEmit, next lint, next build), against the
# same Postgres database name/credentials tests/conftest.py already hardcodes
# (TEST_DATABASE_URL), so this isn't a guess at what the test suite needs —
# it's what's already been run manually, wired into a workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_ai_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/universal_ai_erp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d universal_ai_erp \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: AI-Native ERP
          NEXT_PUBLIC_APP_VERSION: 0.1.0
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
